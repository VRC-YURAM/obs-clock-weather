<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OBS 시계 · 한 줄형</title>
<style>
body{margin:0;padding:8px;overflow:hidden;background:transparent;color:#fff;font-family:"Malgun Gothic",sans-serif}
.clock{white-space:nowrap;font-weight:650;font-variant-numeric:tabular-nums}.date{line-height:1.25}.time{line-height:1.12;font-weight:700;letter-spacing:-.025em}
.clock{display:flex;align-items:center;gap:16px}.date{font-size:17px}.time{font-size:30px}

</style></head>
<body><div class="clock"><span id="date" class="date"></span><span id="time" class="time"></span></div>
<script>
const date = document.getElementById("date");
const time = document.getElementById("time");
const dateFormat = new Intl.DateTimeFormat("ko-KR", {
  timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric",
});
const timeFormat = new Intl.DateTimeFormat("ko-KR", {
  timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23",
});
function update() {
  const now = new Date();
  date.textContent = dateFormat.format(now);
  time.textContent = timeFormat.format(now);
  setTimeout(update, 1000 - Date.now() % 1000);
}
update();
</script></body></html>
