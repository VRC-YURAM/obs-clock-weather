<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS 현재 날씨</title>
<style>
  body { margin: 0; padding: 8px; overflow: hidden; background: transparent; color: #000; font-family: "Malgun Gothic", sans-serif; }
  .weather { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; font-size: 17px; font-weight: 650; }
  #temperature { font-size: 30px; font-variant-numeric: tabular-nums; }
  a { display: block; color: inherit; font-size: 11px; text-decoration: none; }
.weather{width:max-content;margin:auto;padding:3px 15px;align-items:center;border:1px solid currentColor;border-radius:999px;gap:8px} #icon{font:20px/1 "Segoe UI Symbol",sans-serif} #temperature{font-size:24px;line-height:1.1} #location,#condition{font-size:14px} #temperature,#location,#condition{position:relative;top:-1px}
.widget-credit{display:block;text-align:center;margin-top:2px;font-size:10px;line-height:11px;color:inherit}
.weather #location,.weather #condition{line-height:1.2} .weather .details{line-height:1.2}
</style>
</head>
<body>
<div class="weather"><span id="icon" aria-hidden="true"></span><span id="temperature">—</span><span id="location"></span><span id="condition">날씨 불러오는 중</span></div>
<a class="widget-credit" href="https://open-meteo.com/">날씨 데이터 제공 · Open-Meteo</a>
<script>
  function describeWeather(code) {
    if (code === 0) return "맑음";
    if (code <= 2) return "구름 조금";
    if (code === 3) return "흐림";
    if (code === 45 || code === 48) return "안개";
    if (code >= 95) return "뇌우";
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "눈";
    if (code >= 51 && code <= 57) return "이슬비";
    if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "비";
    return "상태 미상";
  }

  // 전환 방향은 "up"이 위로, "down"은 아래로, "none"은 즉시 전환합니다.
  const settings = { transition: "up", secondsPerCity: 8 };
  const cities = [
    ["서울", 37.5665, 126.9780], ["인천", 37.4563, 126.7052],
    ["춘천", 37.8813, 127.7298], ["대전", 36.3504, 127.3845],
    ["광주", 35.1595, 126.8526], ["대구", 35.8714, 128.6014],
    ["부산", 35.1796, 129.0756], ["제주", 33.4996, 126.5312],
  ];
  const weather = document.querySelector(".weather");
  const fields = Object.fromEntries(["location", "temperature", "condition", "icon"]
    .map(id => [id, document.getElementById(id)]));
  let readings = [];
  let shownCity = "";
  let stale = false;

  function render(reading, moving) {
    fields.location.textContent = reading.city;
    fields.temperature.textContent = Math.round(reading.temperature) + "°C";
    fields.condition.textContent = reading.condition + (stale ? " · 이전 정보" : "");
    if (fields.icon) fields.icon.textContent = weatherIcon(reading.condition);
    shownCity = reading.city;
    if (moving && ["up", "down"].includes(settings.transition) &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const offset = settings.transition === "up" ? 12 : -12;
      for (const child of weather.children) {
        child.animate([{ opacity: 0, transform: "translateY(" + offset + "px)" },
          { opacity: 1, transform: "translateY(0)" }], { duration: 320, easing: "ease-out" });
      }
    }
  }

  setInterval(() => {
    if (readings.length < 2) return;
    const current = readings.findIndex(reading => reading.city === shownCity);
    render(readings[(current + 1) % readings.length], true);
  }, settings.secondsPerCity * 1000);

  async function updateWeather() {
    const params = new URLSearchParams({
      latitude: cities.map(([, lat]) => lat).join(","),
      longitude: cities.map(([, , lon]) => lon).join(","),
      current: "temperature_2m,weather_code",
    });
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const response = await fetch("https://api.open-meteo.com/v1/forecast?" + params, { signal: controller.signal });
      if (!response.ok) throw new Error("Weather HTTP " + response.status);
      const payload = await response.json();
      const rows = Array.isArray(payload) ? payload : [payload];
      if (rows.length !== cities.length) throw new Error("Unexpected city count");
      const next = cities.flatMap(([city], index) => {
        const current = rows[index]?.current;
        if (!Number.isFinite(current?.temperature_2m) || !Number.isFinite(current.weather_code)) return [];
        return [{ city, temperature: current.temperature_2m, condition: describeWeather(current.weather_code) }];
      });
      if (!next.length) throw new Error("Missing weather");
      readings = next;
      stale = false;
      render(readings.find(reading => reading.city === shownCity) || readings[0], false);
    } catch {
      stale = true;
      if (readings.length) render(readings.find(reading => reading.city === shownCity) || readings[0], false);
      else fields.condition.textContent = "날씨 연결 안 됨";
    } finally {
      clearTimeout(timeout);
      setTimeout(updateWeather, stale ? 120000 : 600000);
    }
  }

  function weatherIcon(condition) {
    return ({
      "맑음": "☀︎", "구름 조금": "☁︎", "흐림": "☁︎", "안개": "≋",
      "뇌우": "ϟ", "눈": "❄︎", "이슬비": "☂︎", "비": "☂︎",
    })[condition] || "·";
  }

  updateWeather();
</script>
</body>
</html>
